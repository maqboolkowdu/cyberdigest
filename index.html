<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Security: only this site's own scripts may run (no inline scripts), and the only other
       server the page may talk to is the Supabase project used for sign-in and usage stats. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://nrwkxvnkalbsezemtrex.supabase.co; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CyberDigest — Daily Cyber Bytes</title>
  <meta name="description" content="Bite-size daily cyber security news from around the world with a GCC focus: UAE, Saudi Arabia, Qatar, Oman, Bahrain and Kuwait." />
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <!-- Sustainable by design: system fonts only, no web fonts, ads or third-party scripts. -->
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="stylesheet" href="assets/css/immersive.css" />
  <link rel="stylesheet" href="assets/css/welcome.css" />
  <script src="assets/js/boot.js"></script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="masthead">
    <a class="brand" href="#/today" aria-label="CyberDigest home">
      <span class="brand-mark">CYBER<br />DIGEST</span>
    </a>
    <nav class="topnav" id="nav" aria-label="Main navigation"></nav>
    <div class="mast-right">
      <span class="mast-stats" id="mastStats"></span>
      <button class="icon-btn" id="btnTheme" title="Toggle light / dark" aria-label="Toggle light or dark theme"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
    </div>
  </header>

  <main class="main">
    <div class="page-head" id="pageHead">
      <h1 id="pageTitle">Today</h1>
      <p id="pageSub"></p>
    </div>
    <section id="view" class="view" tabindex="-1"></section>
  </main>

  <footer class="site-foot" id="siteFoot"></footer>

  <nav class="bottom-nav" id="bottomNav" aria-label="Mobile navigation"></nav>

  <!-- Story reader -->
  <dialog id="reader" class="sheet">
    <div class="sheet-card" id="readerBody"></div>
  </dialog>

  <!-- Save to stash -->
  <dialog id="saveDlg" class="modal">
    <form method="dialog" class="modal-card" id="saveForm">
      <h2>Save to a stash</h2>
      <div id="stashPick" class="stash-pick"></div>
      <label class="field"><span>New stash</span><input id="newStash" placeholder="e.g. Ransomware cases for my blog" maxlength="60" /></label>
      <label class="field"><span>Your note <small class="muted">(optional)</small></span><textarea id="saveNote" rows="3" placeholder="Why does this matter for our campus / organisation?"></textarea></label>
      <div class="row end">
        <button value="cancel" class="btn">Cancel</button>
        <button value="ok" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Welcome tour (first visit, "Replay welcome tour", and Sign in) -->
  <section id="welcome" class="welcome" hidden aria-label="Welcome to CyberDigest"></section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/track.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/welcome.js"></script>
</body>
</html>
